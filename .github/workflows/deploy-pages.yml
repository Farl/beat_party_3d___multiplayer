name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Enable the host switch only after the backend passes production smoke tests.
    if: ${{ vars.PARTYSERVER_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the legacy PartyKit secret untouched until migration is verified.

      - name: Test Pages build
        run: npm test

      - name: Build production assets
        env:
          PARTYKIT_HOST: ${{ vars.PARTYSERVER_HOST }}
        run: npm run build:pages

      - name: Validate Worker bundle
        run: npm run check:worker

      # Cloudflare Workers Builds deploys the backend from this repository.

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
